[tool.poetry]
name = "VChess"
version = "0.1.0"
description = "Minimal dev setup: FastAPI + uvicorn + static files"
authors = ["Adrian Nowowiejski <anowowiejski123@gmail.com>"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.118.0"
uvicorn = {extras = ["standard"], version = "^0.37.0"}
vosk = "^0.3.45"
numpy = "^1.26.2"
python-multipart = "^0.0.6"
chess = "^1.11.2"
gunicorn = "^23.0.0"
httpx = "^0.28.1"
firebase-admin = "^7.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"

[build-system]
requires = ["poetry-core>=1.5.0"]
build-backend = "poetry.core.masonry.api"
