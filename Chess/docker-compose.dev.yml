version: '3.8'

services:
  game_service:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: game_service_dev
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - ANALYSIS_SERVICE_URL=http://stockfish_analysis_service:8002
    command: poetry run uvicorn app.game_service.main:app --host 0.0.0.0 --port 8000 --reload

  speech_service:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: speech_service
    ports:
      - "8001:8001"
    volumes:
      - ./backend:/app
      - ./backend/app/vosk-model-small-pl-0.22:/vosk-model
    environment:
      - VOSK_MODEL_PATH=/vosk-model
    command: poetry run uvicorn app.speech_service.main:app --host 0.0.0.0 --port 8001 --reload

  stockfish_analysis_service:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: stockfish_analysis_service
    ports:
      - "8002:8002"
    volumes:
      - ./backend:/app
    command: poetry run uvicorn app.stockfish_analysis_service.main:app --host 0.0.0.0 --port 8002 --reload